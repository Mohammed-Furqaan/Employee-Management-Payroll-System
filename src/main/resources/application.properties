# Server Configuration
server.port=8080

# ===================================================================
# Database Configuration (MySQL)
# ===================================================================
# JDBC URL points to localhost and tells MySQL driver to automatically create the database if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/employee_payroll_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP) configurations
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
# Use MySQL dialect for standard SQL translation
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ddl-auto=validate tells Hibernate to verify that the existing database structure 
# matches the Java entity definitions. It makes no changes to the schema.
spring.jpa.hibernate.ddl-auto=validate

# Enables logging of SQL statements generated by Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Flyway Configuration
# ===================================================================
# Enabled in Step 3 to execute and version-control our database schema.
spring.flyway.enabled=true

